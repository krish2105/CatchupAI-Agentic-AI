# XcodeGen spec: `brew install xcodegen && cd ios && xcodegen` creates CatchUpAI.xcodeproj.
name: CatchUpAI
options:
  bundleIdPrefix: ai.catchup
  deploymentTarget:
    iOS: "17.0"
targets:
  CatchUpAI:
    type: application
    platform: iOS
    sources: [CatchUpAI]
    info:
      path: CatchUpAI/Info.plist
      properties:
        CFBundleDisplayName: CatchUp AI
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: ai.catchup.schedule
            UIApplicationShortcutItemTitle: Study schedule
            UIApplicationShortcutItemSubtitle: Month calendar
            UIApplicationShortcutItemIconSymbolName: calendar
          - UIApplicationShortcutItemType: ai.catchup.copilot
            UIApplicationShortcutItemTitle: AI copilot
            UIApplicationShortcutItemIconSymbolName: sparkles
          - UIApplicationShortcutItemType: ai.catchup.focus
            UIApplicationShortcutItemTitle: Focus sprint
            UIApplicationShortcutItemIconSymbolName: leaf
          - UIApplicationShortcutItemType: ai.catchup.progress
            UIApplicationShortcutItemTitle: Recovery tracker
            UIApplicationShortcutItemIconSymbolName: chart.bar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.catchup.app
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
