name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Production dependencies only; dev-only tooling advisories are tracked in SECURITY_AUDIT.md.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          # Placeholders: the build never contacts Supabase (every page renders per request).
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      - name: No secret key values in the browser bundle
        # Key formats, not names: the UI legitimately mentions OPENAI_API_KEY, and supabase-js checks prefixes.
        run: |
          if grep -rEl "sb_secret_[A-Za-z0-9_-]{16,}|sk-(proj-)?[A-Za-z0-9_-]{24,}" .next/static; then
            echo "Secret key material found in client bundle"; exit 1
          fi

  system:
    name: Integration, E2E and eval (local Supabase)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase (pinned signing key generated on the fly)
        run: npm run db:start
      - name: Write .env.local from the local stack (CI-only, ephemeral test values)
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3100"
            echo "OPENAI_EMBEDDING_MODEL=text-embedding-3-small"
            echo "MAILPIT_URL=$MAILPIT_URL"
          } > .env.local
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run eval
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
