// User actions are delegated because every screen is generated from application state.
document.addEventListener('click',e=>{
 if(e.target.id==='modal-overlay'){closeModal();return}
 const page=e.target.closest('[data-page]');if(page){navigate(page.dataset.page);return}
 const actEl=e.target.closest('[data-action]');if(!actEl)return;const act=actEl.dataset.action;
 switch(act){
 case 'toggle-mobile':document.body.classList.toggle('nav-open');break;
 case 'close-mobile':document.body.classList.remove('nav-open');break;
 case 'notifications':toast('Demo alert: Regression report due Friday, November 6');break;
 case 'tour':tour();break;
 case 'tour-start':closeModal();navigate('dashboard');break;
 case 'tour-agent':closeModal();navigate('agent');break;
 case 'close-modal':closeModal();break;
 case 'open-search':searchModal();break;
 case 'search-open':closeModal();navigate(actEl.dataset.target);break;
 case 'start-recovery':state.chat.push({role:'user',text:'I missed Module 4 and my regression assignment is due Friday. Help me catch up.'});generateProposal(true);break;
 case 'generate-proposal':generateProposal(state.page==='agent');break;
 case 'approve-plan':approvePlan();break;
 case 'reject-plan':rejectPlan();break;
 case 'toggle-task':{const task=state.tasks.find(t=>t.id===Number(actEl.dataset.id));if(task){task.done=!task.done;render();toast(task.done?'Task marked complete':'Task marked incomplete')}break}
 case 'select-course':state.selectedCourse=actEl.dataset.course;navigate('courses');break;
 case 'filter-all':state.selectedCourse='all';render();break;
 case 'add-course':addCourseModal();break;
 case 'add-assignment':addAssignmentModal();break;
 case 'upload-click':$('#pdf-file')?.click();break;
 case 'ask-document':navigate('agent');chatRespond('Explain linear regression from my course notes');break;
 case 'chat-suggestion':chatRespond(actEl.dataset.prompt);break;
 case 'clear-chat':state.chat=initial().chat;state.toolSteps=[];state.proposalPending=false;state.proposalRejected=false;render();toast('Conversation reset');break;
 case 'analyze-capacity':navigate('agent');chatRespond('Analyze my workload and available study hours');break;
 case 'select-day':state.selectedDay=Number(actEl.dataset.day);render();break;
 case 'start-quiz':startQuiz();break;
 case 'select-option':state.quizAnswers[state.quizIndex]=Number(actEl.dataset.option);render();break;
 case 'next-question':nextQuestion();break;
 case 'quit-quiz':state.quizStarted=false;state.quizIndex=0;render();break;
 case 'restart-quiz':startQuiz();break;
 case 'replan-after-quiz':replanAfterQuiz();break;
 case 'toggle-motion':state.reducedMotion=!state.reducedMotion;render();toast(state.reducedMotion?'Reduced motion on':'Motion enabled');break;
 case 'toggle-notifications':state.notifications=!state.notifications;render();toast('Demo preference updated');break;
 case 'reset-demo':showModal(`<h2>Reset the interactive demo?</h2><p>This will restore all sample tasks, courses, quiz results and agent conversations. No real account data exists in this prototype.</p><div class="flex gap8" style="margin-top:22px"><button class="btn btn-primary" data-action="confirm-reset">Reset demo</button><button class="btn btn-ghost" data-action="close-modal">Cancel</button></div>`);break;
 case 'confirm-reset':state=initial();closeModal();navigate('dashboard');toast('Demo restored to its starting state');break;
 }
});
document.addEventListener('submit',e=>{
 if(e.target.id==='chat-form'){e.preventDefault();const input=$('#chat-input');const value=input?.value||'';chatRespond(value);return}
 if(e.target.id==='course-form'){e.preventDefault();const form=new FormData(e.target),title=String(form.get('title')||'').trim().slice(0,70),code=String(form.get('code')||'').trim().slice(0,14);if(!title)return;const id='custom-'+(++state.customCourseIndex);state.courses.push({id,title,code:code||'NEW',icon:'✧',accent:'#85dbe1',progress:0,modules:0,done:0,teacher:'Your course'});state.selectedCourse=id;closeModal();navigate('courses');toast('Sample course added');return}
 if(e.target.id==='assignment-form'){e.preventDefault();const form=new FormData(e.target),title=String(form.get('title')||'').trim().slice(0,90),course=String(form.get('course')||''),due=String(form.get('due')||'');if(!title||!/^\d{4}-\d{2}-\d{2}$/.test(due))return;const [y,m,d]=due.split('-').map(Number),date=new Date(Date.UTC(y,m-1,d));state.assignments.push({id:'a'+Date.now(),title,course,due:date.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}),day:date.toLocaleDateString('en-US',{weekday:'short',timeZone:'UTC'}).toUpperCase(),date:String(d).padStart(2,'0'),effort:'Estimate pending',priority:'Medium'});closeModal();navigate('courses');toast('Assignment added to your demo tracker');return}
});
document.addEventListener('change',e=>{if(e.target.id==='pdf-file'){const file=e.target.files?.[0];if(!file)return;if(!file.name.toLowerCase().endsWith('.pdf')){toast('Please choose a PDF file');return}if(file.size>15*1024*1024){toast('The prototype accepts PDFs up to 15 MB');return}state.docs.unshift({id:'demo-'+Date.now(),name:file.name,course:state.selectedCourse==='all'?'statistics':state.selectedCourse,pages:null,uploaded:'Added in this browser'});render();toast('Filename added locally; PDF content was not processed')}});
document.addEventListener('input',e=>{
 if(e.target.id==='search-query'){$('#search-results').innerHTML=searchResults(e.target.value);return}
 if(e.target.id==='capacity-range'){const n=Number(e.target.value);state.capacity=n;$('#capacity-label').textContent=n+'h';$('#capacity-gap').textContent=Math.max(0,9-n)+'h';$('#capacity-meter').style.width=Math.min(100,n/9*100)+'%';$('#capacity-risk').className='risk-banner '+(n>=9?'ok':'');$('#capacity-risk').innerHTML=ic(n>=9?'check':'warning','sm')+`<span>${n>=9?'Your available time covers your estimated workload.':`${9-n} hours of required work do not fit. Prioritize or add time.`}</span>`;save();return}
 if(e.target.id==='settings-capacity'){state.capacity=Number(e.target.value);$('#settings-hours').textContent=state.capacity+'h';save();return}
});
document.addEventListener('dragover',e=>{if(e.target.closest('#drop-area')){e.preventDefault();e.target.closest('#drop-area').classList.add('dragover')}});
document.addEventListener('dragleave',e=>{if(e.target.closest('#drop-area'))e.target.closest('#drop-area').classList.remove('dragover')});
document.addEventListener('drop',e=>{const drop=e.target.closest('#drop-area');if(!drop)return;e.preventDefault();drop.classList.remove('dragover');const file=e.dataTransfer?.files?.[0];if(!file)return;if(!file.name.toLowerCase().endsWith('.pdf')||file.size>15*1024*1024){toast('Choose a PDF no larger than 15 MB');return}state.docs.unshift({id:'demo-'+Date.now(),name:file.name,course:state.selectedCourse==='all'?'statistics':state.selectedCourse,pages:null,uploaded:'Added in this browser'});render();toast('Demo upload added locally; no PDF content was read')});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal()}if(e.key==='Escape'){if($('#modal-overlay'))closeModal();document.body.classList.remove('nav-open')}if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatRespond(e.target.value)}});
window.addEventListener('resize',()=>{if(state.page==='dashboard' && $('#orb-canvas')){if(animationId!==null)cancelAnimationFrame(animationId);animationId=null;startOrb()}});
render();
</script>
